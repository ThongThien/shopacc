name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'frontend/**'  # FE deploy Vercel, không cần build ở đây

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/shopacc-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/shopacc-backend:latest
            docker stop shopacc-backend || true
            docker rm shopacc-backend || true
            docker run -d --name shopacc-backend \
              --env-file /opt/shopacc/.env \
              --network shopacc-net \
              -p 127.0.0.1:8081:8081 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/shopacc-backend:latest
            docker image prune -f
